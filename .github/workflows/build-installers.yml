name: Build CreOS Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: creos-installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    name: Ubuntu .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pyinstaller>=6.10,<7'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile and package for Ubuntu
        run: |
          python packaging/build_binary.py
          python packaging/linux/build_deb.py
      - name: Upload Ubuntu installer
        uses: actions/upload-artifact@v4
        with:
          name: CreOS-Ubuntu
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows Setup .exe
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Verify Python syntax
        run: python -m compileall -q main.py creos_profile.py setup_wizard.py creos_updater.py state_store.py files_store.py
      - name: Build app bundle
        run: python packaging/build_binary.py
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content data/releases.json | ConvertFrom-Json).version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\CreOS.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CreOS-Windows
          path: dist/CreOS-Setup-*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tag matches app version
        shell: bash
        run: |
          expected="v$(python -c 'import json; print(json.load(open("data/releases.json"))["version"])')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME != $expected"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: CreOS-*
          path: release_assets
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release_assets/*.deb release_assets/*.exe \
            --title "CreOS $GITHUB_REF_NAME" --generate-notes --latest
