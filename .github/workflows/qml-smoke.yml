name: CreOS QML Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qml-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux display and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1 libgl1-mesa-dri \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libasound2t64
      - name: Install PySide6
        run: python -m pip install -r requirements.txt
      - name: Parse app configuration
        run: python -m json.tool data/releases.json > /dev/null
      - name: Run data persistence unit tests
        run: python -m unittest discover -s tests -v
      - name: Load QML scene with desktop OpenGL on virtual X display
        env:
          QSG_RHI_BACKEND: opengl
          LIBGL_ALWAYS_SOFTWARE: '1'
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu --disable-dev-shm-usage'
        run: xvfb-run -a -s "-screen 0 1400x900x24 +extension GLX" python main.py --smoke-test
